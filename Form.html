<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Tag</title>
</head>
<body>
    <h1>Using Form Tag</h1>
    <form>
        <label for="">Username:</label><input type="text" name="user" id="text_input" placeholder="Enter Username"><br><br>
       <label for=""> Password:</label><input type="Password"  name="pass"  required placeholder="Enter Password"><br><br>
       <label for="">Email:</label> <input type="email" name="email" required  placeholder="Enter Email">
        <p>Courses:</p>
        Java<input type="Checkbox">
        Python<input type="Checkbox">
        C++ <input type="Checkbox">
        Data Science<input type="Checkbox">
        IT<input type="Checkbox"><br><br>
        <P>Gender:</P>
       <label for="male"> Male </label><input type="radio" value="male" id="male" name="gender">
        <label for="female">Female</label><input type="radio" value="female" id="female" name="gender"><br><br>
        <input type="submit">
        <input type="Reset">
        <button type="submit">Registration</button>
        <button type="submit">Click</button>

       
       
    </form>
</body>
</html>
